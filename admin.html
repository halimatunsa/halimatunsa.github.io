<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Kandungan | Cikgu Halimatun</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<!-- data.js dimuat dengan penanda masa seminit supaya panel sentiasa
     membaca kandungan terkini, bukan salinan cache. -->
<script>document.write('<script src="data.js?v=' + Math.floor(Date.now() / 60000) + '"><\/script>');</script>
<style>
:root{
  --bg:#F5F7FA;--surface:#FFFFFF;--ink:#16222F;--muted:#57697C;
  --blue-950:#0A1E33;--blue-900:#13304E;--blue-700:#22568A;--blue-100:#E2EAF3;
  --amber:#C4861F;--amber-soft:#F4E7CF;--line:rgba(22,34,47,.10);
  --radius-card:18px;--radius-input:10px;
  --ease:cubic-bezier(.32,.72,0,1);
  --font-display:"Bricolage Grotesque",sans-serif;--font-body:"Manrope",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--font-display);color:var(--blue-950);letter-spacing:-.01em}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:1rem;
  padding:.8rem clamp(1rem,3vw,1.8rem);background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.topbar .brand{display:flex;align-items:center;gap:.65rem;font-family:var(--font-display);font-weight:700;font-size:1rem}
.topbar .brand .mark{width:32px;height:32px;border-radius:999px;background:var(--blue-900);color:#F3EBD8;display:grid;place-items:center;font-size:.68rem;font-weight:700}
.status{font-size:.78rem;color:var(--muted);flex:1;min-width:140px}
.status b{color:var(--blue-700)}
.tb-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;
  font-weight:700;font-size:.83rem;padding:.55rem 1.1rem;border:1.5px solid transparent;
  transition:transform .4s var(--ease),background .4s var(--ease),border-color .4s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn i{font-size:1rem}
.btn-primary{background:var(--blue-900);color:#F6F3E9}
.btn-primary:hover{background:var(--blue-700)}
.btn-amber{background:var(--amber);color:var(--blue-950)}
.btn-amber:hover{background:#D89A33}
.btn-ghost{background:transparent;border-color:rgba(22,34,47,.18);color:var(--blue-950)}
.btn-ghost:hover{border-color:var(--blue-700)}
.btn-danger{background:transparent;border-color:rgba(160,60,40,.35);color:#8A3324}
.btn-danger:hover{background:rgba(160,60,40,.06)}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:230px 1fr;gap:1.4rem;max-width:1240px;margin:1.4rem auto 4rem;padding-inline:clamp(1rem,3vw,1.8rem)}
.side{position:sticky;top:74px;align-self:start;display:grid;gap:.3rem}
.side button{
  text-align:left;border:none;background:transparent;border-radius:12px;
  padding:.65rem .9rem;font-size:.88rem;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:.6rem;
  transition:background .3s var(--ease),color .3s var(--ease);
}
.side button i{font-size:1.05rem}
.side button:hover{color:var(--blue-950);background:rgba(34,86,138,.06)}
.side button.active{background:var(--blue-900);color:#F6F3E9}
.panel{min-width:0}
.panel h2{font-size:1.5rem;margin-bottom:.3rem}
.panel .desc{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem;max-width:64ch}

/* ---------- cards & fields ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:1.3rem 1.4rem;margin-bottom:1rem}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.9rem}
.card-head h3{font-size:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem}
.f{display:grid;gap:.3rem;margin-bottom:.9rem;min-width:0}
.f:last-child{margin-bottom:0}
.f-label{font-size:.76rem;font-weight:700;color:var(--blue-700);letter-spacing:.02em}
.f-help{font-size:.72rem;color:var(--muted)}
input[type=text],input[type=url],input[type=date],input[type=number],textarea,select{
  width:100%;padding:.6rem .8rem;border-radius:var(--radius-input);
  border:1px solid rgba(22,34,47,.16);background:#FBFCFE;color:var(--ink);
  font-family:inherit;font-size:.88rem;transition:border-color .3s;
}
textarea{resize:vertical;min-height:74px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
.row-actions{display:flex;gap:.4rem;flex:0 0 auto}
.icon-btn{
  width:32px;height:32px;border-radius:999px;border:1px solid rgba(22,34,47,.14);
  background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:.95rem;
  transition:color .3s,border-color .3s,background .3s;
}
.icon-btn:hover{color:#8A3324;border-color:rgba(160,60,40,.4);background:rgba(160,60,40,.05)}
.add-btn{
  width:100%;border:1.5px dashed rgba(22,34,47,.22);background:transparent;border-radius:var(--radius-card);
  padding:.8rem;font-weight:700;font-size:.85rem;color:var(--blue-700);
  display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1rem;
  transition:border-color .3s,background .3s;
}
.add-btn:hover{border-color:var(--blue-700);background:rgba(34,86,138,.04)}
.subtabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.32rem;width:max-content;max-width:100%}
.subtabs button{border:none;background:transparent;border-radius:999px;padding:.45rem .95rem;font-size:.82rem;font-weight:700;color:var(--muted)}
.subtabs button.active{background:var(--blue-900);color:#F6F3E9}
.warn{
  display:flex;gap:.7rem;align-items:flex-start;background:#FBEFE9;border:1px solid rgba(160,60,40,.25);
  border-radius:var(--radius-card);padding:1rem 1.2rem;margin-bottom:1.2rem;font-size:.84rem;color:#6E2A1A;
}
.warn i{color:#A03C28;font-size:1.15rem;margin-top:.1rem}
.info{
  display:flex;gap:.7rem;align-items:flex-start;background:var(--blue-100);border:1px solid rgba(34,86,138,.15);
  border-radius:var(--radius-card);padding:1rem 1.2rem;margin-bottom:1.2rem;font-size:.84rem;color:var(--blue-900);
}
.info i{color:var(--blue-700);font-size:1.15rem;margin-top:.1rem}
.thumb{width:78px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--blue-100);flex:0 0 auto}
.gal-row{display:flex;gap:.9rem;align-items:flex-start}
.gal-row .fields{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:.5rem;font-size:.84rem;font-weight:600;color:var(--muted)}
.check input{width:16px;height:16px;accent-color:var(--blue-700)}
.mini-table{display:grid;gap:.5rem}
.mini-row{display:grid;grid-template-columns:1fr 90px 80px 32px;gap:.5rem;align-items:center}
.mini-row.pbd{grid-template-columns:1fr 90px 32px}
.mini-head-row{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.langkah{display:grid;gap:.7rem;counter-reset:step}
.langkah div{display:flex;gap:.7rem;align-items:flex-start;font-size:.86rem}
.langkah div::before{
  counter-increment:step;content:counter(step);
  width:24px;height:24px;border-radius:999px;background:var(--blue-100);color:var(--blue-700);
  font-weight:800;font-size:.75rem;display:grid;place-items:center;flex:0 0 auto;margin-top:.1rem;
}
.fatal{max-width:560px;margin:4rem auto;text-align:center;padding:2rem}
.fatal i{font-size:2.6rem;color:#A03C28}
.fatal h2{margin:.8rem 0 .5rem}
.fatal p{color:var(--muted);font-size:.9rem}

/* ============================================================
   PAPAN PEMUKA (semua gaya dinamakan di bawah .papan supaya
   tidak berlanggar dengan .card / .grid2 sedia ada panel ini)
   ============================================================ */
.papan .filters{display:flex;gap:.7rem;flex-wrap:wrap;align-items:end;margin-bottom:1.2rem}
.papan .filters .f{display:grid;gap:.3rem;margin-bottom:0}
.papan .filters label{font-size:.72rem;font-weight:700;color:var(--blue-700);letter-spacing:.04em}
.papan .filters select{
  padding:.55rem .8rem;border-radius:10px;border:1px solid rgba(22,34,47,.16);
  background:var(--surface);font-family:inherit;font-size:.86rem;min-width:150px;
}
.papan .filters select:focus{outline:2px solid var(--amber);outline-offset:1px}
.papan .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.2rem}
.papan .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:1.2rem 1.3rem}
.papan .tile .t-label{font-size:.76rem;font-weight:600;color:var(--muted)}
.papan .tile b{font-family:var(--font-display);font-size:2rem;font-weight:800;color:var(--blue-950);line-height:1.15;display:block;font-variant-numeric:tabular-nums}
.papan .tile .t-cap{font-size:.72rem;color:var(--muted)}
.papan .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem}
.papan .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:1.3rem 1.4rem;min-width:0;margin-bottom:0}
.papan .card h3{font-size:1rem;margin-bottom:.2rem}
.papan .card .sub{font-size:.78rem;color:var(--muted);margin-bottom:1rem}
.papan .card.full{grid-column:1/-1}
.papan .chart{width:100%;display:block}
.papan .chart text{font-family:var(--font-body)}
.papan .legend{display:flex;gap:1.1rem;flex-wrap:wrap;margin-bottom:.6rem}
.papan .legend span{display:inline-flex;align-items:center;gap:.45rem;font-size:.78rem;font-weight:600;color:var(--muted)}
.papan .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.papan .dua-jadual{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.papan table{width:100%;border-collapse:collapse;font-size:.85rem}
.papan th{
  text-align:left;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:.5rem .4rem;border-bottom:1px solid var(--line);
}
.papan td{padding:.55rem .4rem;border-bottom:1px solid rgba(22,34,47,.05)}
.papan td:last-child,.papan th:last-child{text-align:right}
.papan td.num{text-align:right;font-variant-numeric:tabular-nums}
.papan .gred-chip{
  display:inline-block;min-width:2rem;text-align:center;
  background:var(--blue-100);color:var(--blue-900);
  border-radius:999px;padding:.1rem .5rem;font-weight:800;font-size:.74rem;
}
.papan .notis{display:flex;gap:.6rem;align-items:flex-start;background:var(--blue-100);border:1px solid rgba(34,86,138,.15);border-radius:var(--radius-card);padding:.9rem 1.1rem;margin-bottom:1.2rem;font-size:.82rem;color:var(--blue-900)}
.papan .notis i{color:var(--blue-700);margin-top:.1rem}
.papan .kosong{color:var(--muted);font-size:.85rem;padding:1.5rem 0;text-align:center}
.tooltip{
  position:fixed;z-index:100;pointer-events:none;opacity:0;
  background:var(--blue-950);color:#E8EDF2;border-radius:10px;
  padding:.55rem .8rem;font-size:.78rem;line-height:1.5;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.4);
  transition:opacity .15s;max-width:260px;
}
.tooltip b{color:#F3EBD8}
.tooltip .tt-row{display:flex;align-items:center;gap:.45rem}
.tooltip .tt-row i{width:8px;height:8px;border-radius:2px;display:inline-block}

@media (max-width:900px){
  .papan .tiles{grid-template-columns:1fr 1fr}
  .papan .grid2,.papan .dua-jadual{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;display:flex;overflow-x:auto;gap:.3rem;padding-bottom:.3rem}
  .side button{white-space:nowrap}
  .grid2,.grid3{grid-template-columns:1fr}
  .mini-row{grid-template-columns:1fr 70px 60px 32px}
}
/* ---------- gate kata laluan ---------- */
body.terkunci .topbar,body.terkunci .shell{display:none}
body:not(.terkunci) #gate{display:none}
#gate{min-height:100dvh;display:grid;place-items:center;padding:1.5rem}
.gate-kad{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2rem;box-shadow:0 24px 60px -28px rgba(19,48,78,.22)}
.gate-kad .mark{width:44px;height:44px;border-radius:999px;background:var(--blue-900);color:#F3EBD8;display:grid;place-items:center;font-size:.85rem;font-weight:700;margin-bottom:1rem}
.gate-kad h2{font-size:1.3rem;margin-bottom:.35rem}
.gate-kad p{font-size:.86rem;color:var(--muted);margin-bottom:1.3rem}
.gate-kad label{display:block;font-size:.76rem;font-weight:700;color:var(--blue-700);margin-bottom:.35rem}
.gate-kad input{width:100%;padding:.72rem .9rem;border-radius:10px;border:1px solid rgba(22,34,47,.16);background:#FBFCFE;font-family:inherit;font-size:.92rem;margin-bottom:1.1rem}
.gate-kad input:focus{outline:2px solid var(--amber);outline-offset:1px}
.gate-err{color:#8A3324;font-size:.82rem;margin-top:.9rem;min-height:1.1em}
/* kad tukar kata laluan */
.pass-row{display:grid;gap:.7rem;max-width:420px}
</style>

<script>
/* ============================================================
   PANEL KANDUNGAN (CMS)
   Aliran kerja:
   1. Panel ini memuatkan kandungan daripada data.js.
   2. Setiap perubahan disimpan secara automatik sebagai DRAF
      dalam pelayar ini (localStorage).
   3. Klik "Muat Turun data.js" untuk mendapatkan fail baharu,
      kemudian GANTIKAN fail data.js di folder laman / hosting.
   ============================================================ */
const DRAF_KEY = "uh_cms_draft";
const shell = document.getElementById("shell");
const panel = document.getElementById("panel");
const sideNav = document.getElementById("sideNav");
const statusText = document.getElementById("statusText");

const $ = id => document.getElementById(id);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
/* tukar pautan Google Drive kepada URL imej lh3 (untuk pratonton thumbnail) */
function imejKecil(u) {
  u = String(u || "");
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^]*?id=|thumbnail\?[^]*?id=)([\w-]{20,})/)
        || u.match(/lh3\.googleusercontent\.com\/d\/([\w-]{20,})/)
        || u.match(/[?&]id=([\w-]{20,})/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w200` : u;
}

/* ---------- muat data ---------- */
let state = null;
let sumberDraf = false;
(function initState() {
  /* SENTIASA mula daripada data.js terkini supaya panel ini sentiasa sama
     dengan laman. Dahulu panel memuat "draf" lama daripada pelayar, jadi
     kandungan baharu (cth Bank Soalan) nampak kosong walaupun ia ada di
     laman. Draf lama dibuang supaya tiada lagi ketidakpadanan. */
  if (window.SITE_DATA) state = JSON.parse(JSON.stringify(window.SITE_DATA));
  localStorage.removeItem(DRAF_KEY);
  if (state) {
    if (!state.tetapan) state.tetapan = {};
    if (state.tetapan.apiUrl === undefined) state.tetapan.apiUrl = "";
    if (state.tetapan.cadanganNama === undefined) state.tetapan.cadanganNama = true;
    if (!Array.isArray(state.bankSoalan)) state.bankSoalan = [];
    if (!Array.isArray(state.rekod)) state.rekod = [];
  }
  if (!state) {
    shell.innerHTML = `<div class="fatal" style="grid-column:1/-1">
      <i class="ph-fill ph-warning-octagon"></i>
      <h2>Fail data.js tidak dijumpai</h2>
      <p>Pastikan fail <b>admin.html</b> berada dalam folder yang sama dengan <b>data.js</b>, kemudian muat semula halaman ini.</p>
    </div>`;
    throw new Error("data.js missing");
  }
})();

function setStatus(msg, kekal) {
  statusText.innerHTML = msg;
  if (!kekal) {
    clearTimeout(setStatus._t);
    setStatus._t = setTimeout(() => {
      statusText.innerHTML = sumberDraf
        ? `Ada perubahan belum disimpan. Klik <b>Simpan</b>.`
        : `Kandungan sepadan dengan laman.`;
    }, 3500);
  }
}
setStatus(`Kandungan sepadan dengan laman.`, true);

let simpanTimer;
function simpanDraf() {
  clearTimeout(simpanTimer);
  simpanTimer = setTimeout(() => {
    localStorage.setItem(DRAF_KEY, JSON.stringify(state));
    sumberDraf = true;
    setStatus(`Ada perubahan belum disimpan. Klik <b>Simpan</b>.`, true);
  }, 400);
}

/* ---------- akses ikut laluan ("pengumuman.0.tajuk") ---------- */
function dapatkan(obj, path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
}
function tetapkan(obj, path, nilai) {
  const kunci = path.split(".");
  const akhir = kunci.pop();
  const sasaran = kunci.reduce((o, k) => o[k], obj);
  sasaran[akhir] = nilai;
}

/* ---------- pembina medan ---------- */
function fTeks(label, path, opsyen = {}) {
  const nilai = dapatkan(state, path);
  const jenis = opsyen.jenis || "text";
  return `<div class="f">
    <label class="f-label">${esc(label)}</label>
    <input type="${jenis}" data-path="${esc(path)}" ${jenis === "number" ? 'data-num="1"' : ""} value="${esc(nilai)}" ${opsyen.placeholder ? `placeholder="${esc(opsyen.placeholder)}"` : ""}>
    ${opsyen.help ? `<span class="f-help">${esc(opsyen.help)}</span>` : ""}
  </div>`;
}
function fArea(label, path, opsyen = {}) {
  return `<div class="f">
    <label class="f-label">${esc(label)}</label>
    <textarea data-path="${esc(path)}" ${opsyen.rows ? `style="min-height:${opsyen.rows * 24}px"` : ""}>${esc(dapatkan(state, path))}</textarea>
    ${opsyen.help ? `<span class="f-help">${esc(opsyen.help)}</span>` : ""}
  </div>`;
}
function btnBuang(act, arg) {

/* Rekod murid disimpan dalam pangkalan data, bukan dalam data.js (supaya
   maklumat murid tidak terdedah dalam repo awam). Muat turun automatik
   kali pertama tab dibuka supaya panel terus sepadan dengan pangkalan
   data, tanpa perlu klik "Muat dari pangkalan data" secara manual. */
let rekodDimuat = false;
async function autoMuatRekod() {
  if (rekodDimuat || (state.rekod && state.rekod.length)) return;
  const { url, kunci } = apiAsas();
  if (!url || !kunci) return;
  const s = $("dbStatus");
  if (s) s.textContent = "Memuat rekod dari pangkalan data...";
  try {
    const r = await fetch(url + "/rekod_admin.php", { headers: { "X-Admin-Key": kunci } });
    const j = await r.json();
    if (j && j.ok && Array.isArray(j.rekod)) {
      state.rekod = j.rekod;
      rekodDimuat = true;
      if (tabAktif === "rekod") lukisPanel();
      return;
    }
    if (s) s.textContent = (j && j.mesej) || "Gagal memuat rekod.";
  } catch (e) {
    if (s) s.textContent = "API tidak dapat dihubungi.";
  }
}

/* ---------- muat naik foto (dikecilkan, disimpan sebagai data URL) ---------- */
function muatNaikFoto(fail) {
  if (!fail.type.startsWith("image/")) {
    alert("Sila pilih fail imej (JPG / PNG).");
    return;
  }
  const pembaca = new FileReader();
  pembaca.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAKS = 800; /* sisi terpanjang */
      const skala = Math.min(1, MAKS / Math.max(img.width, img.height));
      const w = Math.round(img.width * skala);
      const h = Math.round(img.height * skala);
      const kanvas = document.createElement("canvas");
      kanvas.width = w;
      kanvas.height = h;
      kanvas.getContext("2d").drawImage(img, 0, 0, w, h);
      state.profil.fotoUrl = kanvas.toDataURL("image/jpeg", 0.85);
      simpanDraf();
      lukisPanel();
      setStatus(`Foto dimuat naik ke draf (${w}x${h}). Klik <b>Simpan</b> atau <b>Muat Turun data.js</b> untuk terbitkan.`, true);
    };
    img.onerror = () => alert("Fail imej tidak dapat dibaca.");
    img.src = pembaca.result;
  };
  pembaca.readAsDataURL(fail);
}
panel.addEventListener("change", e => {
  if (e.target.id === "fotoUpload") {
    const f = e.target.files[0];
    if (f) muatNaikFoto(f);
    e.target.value = "";
  }
});

function pulihSandaran() { $("fileImport").click(); }
document.getElementById("fileImport").addEventListener("change", e => {
  const fail = e.target.files[0];
  if (!fail) return;
  const pembaca = new FileReader();
  pembaca.onload = () => {
    try {
      const teks = String(pembaca.result);
      const mula = teks.indexOf("{");
      const akhir = teks.lastIndexOf("}");
      if (mula < 0 || akhir < 0) throw new Error("format");
      const data = JSON.parse(teks.slice(mula, akhir + 1));
      if (!data.profil || !data.bahan) throw new Error("struktur");
      state = data;
      localStorage.setItem(DRAF_KEY, JSON.stringify(state));
      sumberDraf = true;
      lukisPanel();
      setStatus("Fail berjaya diimport dan disimpan sebagai draf.", true);
    } catch (err) {
      alert("Fail tidak dapat dibaca. Pastikan ia fail data.js yang dijana oleh panel ini.");
    }
  };
  pembaca.readAsText(fail);
  e.target.value = "";
});

const PALET = ["#1E7A4E", "#C4861F", "#4172C9"];

async function papanMuatRekod() {
  const { url, kunci } = apiAsas();
  if (url && kunci) {
    try {
      const r = await fetch(url + "/rekod_admin.php", { headers: { "X-Admin-Key": kunci } });
      const j = await r.json();

/* ---------- penyediaan data ---------- */
let PENILAIAN = [], TINGKATAN = [], penilaianPilih = "", tingkatanPilih = "", kelasPilih = "";

function siapkanMeta() {
  PENILAIAN = [];
  REKOD_PAPAN.forEach(r => (r.exam || []).forEach(x => {
    if (x.nama && !PENILAIAN.includes(x.nama)) PENILAIAN.push(x.nama);
  }));
  TINGKATAN = [...new Set(REKOD_PAPAN.map(r => r.tingkatan).filter(Boolean))].sort();
  const adaMarkah = t => REKOD_PAPAN.some(r => r.tingkatan === t && (r.exam || []).length);
  tingkatanPilih = TINGKATAN.find(adaMarkah) || TINGKATAN[0] || "";
  penilaianPilih = PENILAIAN[PENILAIAN.length - 1] || "";
  kelasPilih = "";
}

const kelasDlm = t => [...new Set(REKOD_PAPAN.filter(r => r.tingkatan === t).map(r => r.kelas))].sort();
const warnaKelas = () => {
  const peta = {};
  kelasDlm(tingkatanPilih).forEach((k, i) => { peta[k] = PALET[i % PALET.length]; });
  return peta;
};
const markahBagi = (r, penilaian) => {
  const x = (r.exam || []).find(e => e.nama === penilaian);
  return x && typeof x.markah === "number" ? x : null;
};
const tapis = () => REKOD_PAPAN.filter(r =>
  r.tingkatan === tingkatanPilih && (!kelasPilih || r.kelas === kelasPilih)
);
const purata = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
const f1 = v => v === null ? "-" : (Math.round(v * 10) / 10).toLocaleString("ms-MY");

  selTing.addEventListener("change", () => { tingkatanPilih = selTing.value; kelasPilih = ""; isiKelas(); papanLukis(); });
  selKelas.addEventListener("change", () => { kelasPilih = selKelas.value; papanLukis(); });
  selPen.addEventListener("change", () => { penilaianPilih = selPen.value; papanLukis(); });
  papanLukis();
}

/* ---------- lukis semua ---------- */
function papanLukis() {
  const murid = tapis();
  const dgn = murid.map(r => ({ r, x: markahBagi(r, penilaianPilih) })).filter(m => m.x);
  const markah = dgn.map(m => m.x.markah);
  const skopKelas = kelasPilih || "semua kelas";

  /* tiles */
  const pur = purata(markah);
  const lulus = markah.length ? (markah.filter(m => m >= LULUS_MIN).length / markah.length) * 100 : null;
  $("tiles").innerHTML = `
    <div class="tile"><span class="t-label">Jumlah Murid (${esc(tingkatanPilih)})</span><b>${murid.length}</b><span class="t-cap">${esc(skopKelas)}</span></div>
    <div class="tile"><span class="t-label">Ada Markah ${esc(penilaianPilih)}</span><b>${dgn.length}</b><span class="t-cap">daripada ${murid.length} murid</span></div>
    <div class="tile"><span class="t-label">Purata ${esc(penilaianPilih)}</span><b>${f1(pur)}</b><span class="t-cap">markah / 100</span></div>
    <div class="tile"><span class="t-label">Peratus Lulus</span><b>${lulus === null ? "-" : f1(lulus) + "%"}</b><span class="t-cap">markah ${LULUS_MIN} ke atas</span></div>`;

  lukisTaburan(dgn);
  lukisPurataKelas();
  lukisTrend();
  lukisJadual(dgn);
}

/* ---------- carta 1: taburan gred (bar menegak, satu hue) ---------- */
function lukisTaburan(dgn) {
  $("subTaburan").textContent = `${penilaianPilih} · ${kelasPilih || "semua kelas"} ${tingkatanPilih}`;
  const kira = {};
  dgn.forEach(m => { const g = m.x.gred || "-"; kira[g] = (kira[g] || 0) + 1; });
  const greds = GRED_SUSUNAN.filter(g => g in kira);
  Object.keys(kira).forEach(g => { if (!greds.includes(g)) greds.push(g); });
  if (!greds.length) { $("cTaburan").innerHTML = `<p class="kosong">Tiada markah untuk penilaian ini.</p>`; return; }

  const W = 520, H = 240, padL = 30, padB = 26, padT = 18;
  const maxN = Math.max(...greds.map(g => kira[g]));
  const bw = Math.min(44, (W - padL - 8) / greds.length - 6);
  const langkah = maxN <= 5 ? 1 : Math.ceil(maxN / 4);
  let grid = "";
  for (let v = 0; v <= maxN; v += langkah) {
    const y = H - padB - (v / maxN) * (H - padB - padT);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - 4}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
             <text x="${padL - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="#8494A3">${v}</text>`;
  }
  const bars = greds.map((g, i) => {
    const n = kira[g];
    const bh = Math.max(2, (n / maxN) * (H - padB - padT));
    const x = padL + 8 + i * ((W - padL - 8) / greds.length) + ((W - padL - 8) / greds.length - bw) / 2;
    const y = H - padB - bh;
    return `
      <path d="M${x},${y + bh} L${x},${y + 4} Q${x},${y} ${x + 4},${y} L${x + bw - 4},${y} Q${x + bw},${y} ${x + bw},${y + 4} L${x + bw},${y + bh} Z"
            fill="${PALET[0]}" class="bar" data-g="${esc(g)}" data-n="${n}"/>
      <text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#57697C">${n}</text>
      <text x="${x + bw / 2}" y="${H - padB + 14}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#57697C">${esc(g)}</text>`;
  }).join("");
  $("cTaburan").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Taburan gred ${esc(penilaianPilih)}">${grid}${bars}</svg>`;
  $("cTaburan").querySelectorAll(".bar").forEach(b => {
    b.addEventListener("mousemove", ev => ttPapar(`<b>Gred ${esc(b.dataset.g)}</b><br>${b.dataset.n} murid · ${penilaianPilih}`, ev));
    b.addEventListener("mouseleave", ttSembunyi);
  });
}

/* ---------- carta 2: purata mengikut kelas (bar mendatar, warna ikut kelas) ---------- */
function lukisPurataKelas() {
  $("subKelas").textContent = `${penilaianPilih} · ${tingkatanPilih}`;
  const warna = warnaKelas();
  const baris = kelasDlm(tingkatanPilih).map(k => {
    const m = REKOD_PAPAN.filter(r => r.tingkatan === tingkatanPilih && r.kelas === k)
      .map(r => markahBagi(r, penilaianPilih)).filter(Boolean).map(x => x.markah);
    return { k, pur: purata(m), n: m.length };
  }).filter(b => b.pur !== null);
  if (!baris.length) { $("cKelas").innerHTML = `<p class="kosong">Tiada markah untuk penilaian ini.</p>`; return; }

  const W = 520, rowH = 44, padL = 86, padT = 8;
  const H = padT + baris.length * rowH + 18;
  const maks = 100;
  let svg = "";
  [0, 25, 50, 75, 100].forEach(v => {
    const x = padL + (v / maks) * (W - padL - 40);
    svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H - 18}" stroke="var(--grid)" stroke-width="1"/>
            <text x="${x}" y="${H - 4}" text-anchor="middle" font-size="10" fill="#8494A3">${v}</text>`;
  });
  baris.forEach((b, i) => {
    const y = padT + i * rowH + (rowH - 16) / 2;
    const bw = Math.max(3, (b.pur / maks) * (W - padL - 40));
    svg += `
      <text x="${padL - 8}" y="${y + 12}" text-anchor="end" font-size="11" font-weight="600" fill="#57697C">${esc(b.k)}</text>
      <path d="M${padL},${y} L${padL + bw - 4},${y} Q${padL + bw},${y} ${padL + bw},${y + 4} L${padL + bw},${y + 12} Q${padL + bw},${y + 16} ${padL + bw - 4},${y + 16} L${padL},${y + 16} Z"
            fill="${warna[b.k]}" class="kbar" data-k="${esc(b.k)}" data-p="${f1(b.pur)}" data-n="${b.n}"/>
      <text x="${padL + bw + 7}" y="${y + 12}" font-size="11" font-weight="700" fill="#16222F">${f1(b.pur)}</text>`;
  });
  $("cKelas").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Purata ${esc(penilaianPilih)} mengikut kelas">${svg}</svg>`;
  $("cKelas").querySelectorAll(".kbar").forEach(b => {
    b.addEventListener("mousemove", ev => ttPapar(`<b>${esc(b.dataset.k)}</b><br>Purata ${b.dataset.p} · ${b.dataset.n} murid`, ev));
    b.addEventListener("mouseleave", ttSembunyi);
  });
}

/* ---------- carta 3: trend purata (garisan, siri = kelas) ---------- */
function lukisTrend() {
  $("subTrend").textContent = `Purata setiap kelas ${tingkatanPilih} bagi setiap penilaian`;
  const warna = warnaKelas();
  const senaraiKelas = kelasDlm(tingkatanPilih);
  const siri = senaraiKelas.map(k => ({
    k,
    nilai: PENILAIAN.map(p => purata(
      REKOD_PAPAN.filter(r => r.tingkatan === tingkatanPilih && r.kelas === k)
        .map(r => markahBagi(r, p)).filter(Boolean).map(x => x.markah)
    )),
  })).filter(s => s.nilai.some(v => v !== null));

  $("legTrend").innerHTML = siri.map(s =>
    `<span><i style="background:${warna[s.k]}"></i>${esc(s.k)}</span>`).join("");
  if (!siri.length || !PENILAIAN.length) {
    $("cTrend").innerHTML = `<p class="kosong">Tiada markah direkodkan untuk ${esc(tingkatanPilih)} lagi.</p>`;
    return;
  }

  const W = 1080, H = 280, padL = 34, padR = 90, padT = 14, padB = 28;
  const semua = siri.flatMap(s => s.nilai).filter(v => v !== null);
  const lo = Math.max(0, Math.floor((Math.min(...semua) - 8) / 10) * 10);
  const hi = Math.min(100, Math.ceil((Math.max(...semua) + 8) / 10) * 10);
  const X = i => padL + (PENILAIAN.length === 1 ? 0 : i * ((W - padL - padR) / (PENILAIAN.length - 1)));
  const Y = v => H - padB - ((v - lo) / (hi - lo)) * (H - padB - padT);

  let svg = "";
  for (let v = lo; v <= hi; v += 10) {
    svg += `<line x1="${padL}" y1="${Y(v)}" x2="${W - padR + 20}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>
            <text x="${padL - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="#8494A3">${v}</text>`;
  }
  PENILAIAN.forEach((p, i) => {
    svg += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#57697C">${esc(p)}</text>`;
  });
  /* label hujung: jarakkan label yang terlalu rapat supaya tidak bertindih */
  const labelAkhir = [];
  siri.forEach(s => {
    const pts = s.nilai.map((v, i) => v === null ? null : [X(i), Y(v)]).filter(Boolean);
    if (!pts.length) return;
    svg += `<path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="${warna[s.k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p => { svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${warna[s.k]}" stroke="#fff" stroke-width="2"/>`; });
    const akhir = pts[pts.length - 1];
    labelAkhir.push({ k: s.k, x: akhir[0], y: akhir[1] + 3.5 });
  });
  labelAkhir.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labelAkhir.length; i++) {
    if (labelAkhir[i].y - labelAkhir[i - 1].y < 13) labelAkhir[i].y = labelAkhir[i - 1].y + 13;
  }
  labelAkhir.forEach(l => {
    svg += `<text x="${l.x + 10}" y="${l.y}" font-size="10.5" font-weight="700" fill="#57697C">${esc(l.k)}</text>`;
  });
  /* lajur hover: satu per penilaian, tooltip semua siri */
  const lebarLajur = PENILAIAN.length === 1 ? W - padL - padR : (W - padL - padR) / (PENILAIAN.length - 1);
  PENILAIAN.forEach((p, i) => {
    svg += `<rect x="${X(i) - lebarLajur / 2}" y="${padT}" width="${lebarLajur}" height="${H - padT - padB}" fill="transparent" class="hcol" data-i="${i}"/>`;
  });
  $("cTrend").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend purata mengikut penilaian">${svg}</svg>`;
  $("cTrend").querySelectorAll(".hcol").forEach(c => {
    c.addEventListener("mousemove", ev => {
      const i = +c.dataset.i;
      const rows = siri.map(s => s.nilai[i] === null ? "" :
        `<span class="tt-row"><i style="background:${warna[s.k]}"></i>${esc(s.k)}: <b>${f1(s.nilai[i])}</b></span>`).join("");
      ttPapar(`<b>${esc(PENILAIAN[i])}</b><br>${rows}`, ev);
    });
    c.addEventListener("mouseleave", ttSembunyi);
  });
}

/* ---------- jadual top & bawah ---------- */
function lukisJadual(dgn) {
  $("subTop").textContent = `10 markah tertinggi · ${penilaianPilih}`;
  $("subBawah").textContent = `10 markah terendah · ${penilaianPilih}`;
  const jadual = senarai => !senarai.length
    ? `<p class="kosong">Tiada markah untuk penilaian ini.</p>`
    : `<table><thead><tr><th>Nama</th><th>Kelas</th><th>Markah</th><th>Gred</th></tr></thead><tbody>
        ${senarai.map(m => `<tr>
          <td>${esc(m.r.nama)}</td><td>${esc(m.r.kelas)}</td>
          <td class="num">${f1(m.x.markah)}</td>
          <td><span class="gred-chip">${esc(m.x.gred || "-")}</span></td>
        </tr>`).join("")}</tbody></table>`;
  const susun = [...dgn].sort((a, b) => b.x.markah - a.x.markah);
  $("jTop").innerHTML = jadual(susun.slice(0, 10));
  $("jBawah").innerHTML = jadual([...susun].reverse().slice(0, 10));
}

/* ---------- gate kata laluan ---------- */
const gateKey = $("gateKey"), gateMasuk = $("gateMasuk"), gateErr = $("gateErr");
gateKey.value = localStorage.getItem("uh_admin_key") || "";
function bukaPanel() {
  document.body.classList.remove("terkunci");
  lukisSideNav();
  lukisPanel();
}
async function cubaMasuk() {
  const kunci = gateKey.value.trim();
  const apiUrl = String(state.tetapan.apiUrl || "").replace(/\/+$/, "");
  gateErr.textContent = "";
  if (!apiUrl) { if (kunci) localStorage.setItem("uh_admin_key", kunci); bukaPanel(); return; }
  if (!kunci) { gateErr.textContent = "Sila masukkan kata laluan."; return; }
  gateMasuk.disabled = true;
  gateMasuk.innerHTML = '<i class="ph ph-circle-notch"></i> Menyemak...';
  try {
    const r = await fetch(apiUrl + "/rekod_admin.php", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Admin-Key": kunci },
      body: JSON.stringify({ action: "ping" }),
    });
    const j = await r.json();
    if (!j.ok) { gateErr.textContent = j.mesej || "Kata laluan salah."; }
    else { localStorage.setItem("uh_admin_key", kunci); bukaPanel(); return; }
  } catch (e) {
    gateErr.textContent = "API tidak dapat dihubungi. Cuba lagi.";
  }
  gateMasuk.disabled = false;
  gateMasuk.innerHTML = 'Masuk <i class="ph ph-arrow-right"></i>';
}
gateMasuk.addEventListener("click", cubaMasuk);
gateKey.addEventListener("keydown", e => { if (e.key === "Enter") cubaMasuk(); });
gateKey.focus();
</script>
